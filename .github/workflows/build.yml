name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/Minutes.Core.Tests --configuration Release

      - name: Publish Minutes.exe
        run: >
          dotnet publish src/Minutes.App --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none --output artifacts

      - name: Check the executable
        shell: pwsh
        run: |
          $exe = Get-Item artifacts/Minutes.exe
          "Minutes.exe: {0:N1} MB" -f ($exe.Length / 1MB)
          if ($exe.Length -lt 10MB) { throw "Minutes.exe is unexpectedly small" }

      - uses: actions/upload-artifact@v4
        with:
          name: Minutes-win-x64
          path: artifacts/Minutes.exe

      - name: Publish the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Build of ${{ github.sha }}. Download Minutes.exe and open it: see the README for first-run steps."
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest artifacts/Minutes.exe --title "Minutes for Windows (latest build)" --notes $notes --prerelease --target ${{ github.sha }}
